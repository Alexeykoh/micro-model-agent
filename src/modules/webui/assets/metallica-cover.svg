<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Master of Puppets inspired artwork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090202" />
      <stop offset=".32" stop-color="#3a120f" />
      <stop offset=".62" stop-color="#76291c" />
      <stop offset=".86" stop-color="#a94c21" />
      <stop offset="1" stop-color="#d78424" />
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#715a45" />
      <stop offset=".08" stop-color="#32221a" />
      <stop offset=".42" stop-color="#100a08" />
      <stop offset="1" stop-color="#030202" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".95" />
      <stop offset=".22" stop-color="#bd6615" stop-opacity=".72" />
      <stop offset=".58" stop-color="#883825" stop-opacity=".36" />
      <stop offset="1" stop-color="#120606" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="clouds" cx="50%" cy="40%" r="58%">
      <stop offset="0" stop-color="#7b3221" stop-opacity=".3" />
      <stop offset=".62" stop-color="#320c0a" stop-opacity=".44" />
      <stop offset="1" stop-color="#060202" stop-opacity=".72" />
    </radialGradient>
    <linearGradient id="crossLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7" />
      <stop offset=".48" stop-color="#cfc2b1" />
      <stop offset="1" stop-color="#624f43" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
    <g id="grave">
      <path d="M-11-72H11v28h33v16H11v76H-11v-76h-33v-16h33z" fill="url(#crossLight)" stroke="#281812" stroke-width="1.6" />
      <path d="M-6-67H6v27h31v8H6v70H-6V-32h-31v-8h31z" fill="#fffdf6" opacity=".3" />
    </g>
    <g id="smallGrave">
      <path d="M-8-54H8v20h24v12H8v58H-8V-22h-24v-12h24z" fill="url(#crossLight)" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <ellipse cx="800" cy="462" rx="900" ry="320" fill="url(#sun)" />
  <rect width="1600" height="900" fill="url(#clouds)" />
  <rect y="452" width="1600" height="448" fill="url(#field)" />

  <!-- Puppet strings rising past the top edge, outside the canvas. -->
