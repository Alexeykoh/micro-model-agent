<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA · trace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%235cc8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="logo"><span class="dot live" id="dot"></span>MMA&nbsp;·&nbsp;<b>trace</b></div>
  <div id="session"></div>
  <div class="spacer"></div>
  <div id="think"><span class="spinner"></span><span id="thinkTxt">думает…</span></div>
  <div id="elapsed"></div>
  <div id="status">подключение…</div>
</header>
<div class="toolbar">
  <span class="chip on" data-g="tool">Инструменты</span>
  <span class="chip on" data-g="llm">LLM</span>
  <span class="chip on" data-g="text">Текст</span>
  <span class="chip on" data-g="meta">Мета</span>
  <span class="chip on" data-g="phase">Фаза</span>
  <span class="chip on" data-g="err">Ошибки</span>
  <span class="chip on" data-g="sys">Система</span>
  <span class="chip on" data-g="ctx">Контекст</span>
  <input id="search" type="text" placeholder="фильтр…  ( / )" autocomplete="off" spellcheck="false">
  <span id="count">0 событий</span>
  <button class="btn" id="pause">Пауза</button>
  <button class="btn" id="autoscroll" title="прилипать к низу">Авто-прокрутка</button>
  <button class="btn" id="clear">Очистить</button>
</div>
<div class="ctxbar" id="ctxbar">
  <div class="ctx-track" id="ctxTrack" title="токены контекста / бюджет истории">
    <div class="ctx-fill" id="ctxFill"></div>
    <div class="ctx-thresh" id="ctxThresh"></div>
  </div>
  <div class="ctx-info" id="ctxInfo">ctx —</div>
</div>
<div class="split">
  <div id="log"><div class="empty">Ожидание событий…</div></div>
  <div id="side">
    <div class="side-tabs">
      <button class="side-tab on" data-tab="ctx">Контекст</button>
      <button class="side-tab" data-tab="changes">Изменения</button>
      <button class="side-tab" data-tab="plans">Планы</button>
    </div>
    <div class="side-body">
      <section class="pane on" id="pane-ctx">
        <div class="pane-hdr">Разговор <span class="mini" id="ctxStats"></span></div>
        <pre id="ctxText">(ожидание контекста…)</pre>
        <div class="pane-hdr">Живой дифф</div>
        <div id="ctxDelta"></div>
      </section>
      <section class="pane" id="pane-changes">
        <div class="pane-hdr">Изменения контекста</div>
        <div id="ctxHistory"></div>
      </section>
      <section class="pane" id="pane-plans">
        <div class="pane-hdr">Активный план</div>
        <div id="plansActive"></div>
        <div class="pane-hdr">Все планы</div>
        <div id="plansAll"></div>
        <div class="pane-hdr">История планов</div>
        <div id="plansHist"></div>
      </section>
    </div>
  </div>
</div>
<div class="paused-note" id="pausedNote"></div>
<script src="/app.js"></script>
</body>
</html>
