# MMA Agent Service — Kubernetes (deployment/ops, P1).
# Apply: kubectl apply -f deploy/k8s.yaml
# Rollback (one command): kubectl rollout undo deployment/mma -n mma
#   or: kubectl rollout history deployment/mma -n mma  (inspect revisions)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mma
  namespace: mma
  labels:
    app: mma
spec:
  replicas: 1 # silo: 1 process = 1 tenant; scale by adding tenant processes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # drain-safe: agent turns finish before pod swap
  selector:
    matchLabels:
      app: mma
  template:
    metadata:
      labels:
        app: mma
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mma
          image: mma-service:0.25.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: MMA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mma-service
                  key: token
            - name: MMA_SERVICE_HOST
              value: "0.0.0.0"
            - name: MMA_SERVICE_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mma-data
              mountPath: /data
      volumes:
        - name: mma-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mma
  namespace: mma
spec:
  selector:
    app: mma
  ports:
    - port: 8080
      targetPort: http
---
# Cluster-internal RBAC for the service account (least privilege):
# the pod can read its own token secret; it cannot touch other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mma
  namespace: mma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mma
  namespace: mma
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mma-service"]
    verbs: ["get"]
